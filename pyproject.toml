[project]
name = "TinyMOA"
version = "0.1.0"
description = "Inference accelerator for transformer models using compute-in-memory (CIM) cores."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cocotb>=2.0.1",
    "cocotb-test>=0.2.6",
    "klayout>=0.30.7",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.2",
]

[tool.uv.workspace]
members = [
    "sandbox/cpu",
    "sandbox/lpu",
    "test",
    "src/cpu/tests",
]

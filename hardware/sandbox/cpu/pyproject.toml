[project]
name = "tinymoa-cpu-sandbox"
version = "0.1.0"
description = "TinyMOA e-core cycle-accurate model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tinymoa_cpu"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]
